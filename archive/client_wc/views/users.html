<!-- Content Header (Page header) -->
<div class="content-header">
  <div class="container">
    <div class="row">
      <h5 style="margin-left: -0.5rem; margin-bottom: 0;" class="text-dark">Users List ({{users.length}})</h5>
    </div>
  </div>
</div>
<!-- /.content-header -->

<!-- Main content -->
<div class="content">
  <table ng-class="{'table-responsive': isMobileDevice()}"
    class="table table-bordered table-hover table-sm table-striped">
    <thead>
      <tr>
        <th>#</th>
        <th>Mobile</th>
        <th>Account Linked</th>
        <th ng-if="execRights">Map</th>
        <th ng-if="execRights">PIN</th>
        <th ng-if="execRights">Del</th>
      </tr>
    </thead>
    <tbody>
      <tr ng-repeat="user in users | orderBy: '-accounts.length'">
        <td>{{$index + 1}}</td>
        <td>{{user.username}}</td>
        <td>
          <span ng-if="user.accounts.length == 0">{{user.fullname}}</span>
          <span ng-repeat="account in user.accounts">{{account.username}} ({{account.name}}) <button class="btn btn-sm btn-outline-danger badge" ng-if="execRights" ng-click="upMapAccount(account.id)">X</button>&nbsp;|</span>
        </td>
        <td ng-if="execRights">
          <button class="btn btn-sm btn-outline-dark" ng-click="mapAccount(user.id)">Map</button>
        </td>
        <td ng-if="execRights">
          <button class="btn btn-sm btn-outline-dark" ng-click="resetPin(user)">Reset</button>
        </td>
        <td ng-if="execRights">
          <button class="btn btn-sm btn-outline-dark" ng-click="delUser(user.id)">Del</button>
        </td>
      </tr>
    </tbody>
  </table>
</div>
<!-- /.content -->
