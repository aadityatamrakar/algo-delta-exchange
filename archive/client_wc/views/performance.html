<style>
  .positions-font {
    /* font-family: 'ABeeZee', sans-serif; */
    font-family: 'Texturina', serif !important;
  }

  .no-wrap {
    white-space: nowrap;
  }

</style>
<!-- Content Header (Page header) -->
<div class="content-header positions-font">
  <div class="container">
    <div class="row">
      <h5 style="margin-left: -0.5rem; margin-bottom: 0;" class="text-dark">Performance</h5>
    </div>
  </div>
</div>
<!-- /.content-header -->

<!-- Main content -->
<div class="content positions-font">
  <div id="report_chart" style="width: 100%; height: 400px"></div>
  <br>
  <table class="table positions-font table-hover table-striped table-sm">
    <thead>
      <tr>
        <th>Date</th>
        <th class="text-right">MTM</th>
        <th class="text-right">Total PNL</th>
      </tr>
    </thead>
    <tbody>
      <tr ng-repeat="report in reports" ng-class="{'table-success': report.y > 0, 'table-danger': report.y <0}">
        <td>{{parseShortDate(report.x)}}</td>
        <td class="text-right"><span ng-show="report.y>0">+</span>{{roundOff(report.y)}}</td>
        <td class="text-right"><span ng-show="report.c>0">+</span>{{roundOff(report.c)}}</td>
      </tr>
    </tbody>
  </table>

  <br><br><br><br>
</div>
<!-- /.content -->
