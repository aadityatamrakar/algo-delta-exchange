<!-- Content Header (Page header) -->
<div class="content-header positions-font" style="padding: 5px .5rem;">
  <div class="container">
    <div class="row">
      <h5 style="margin-left: -0.5rem; margin-bottom: 0;" class="text-dark">Strategy Management</h5>
      &nbsp;&nbsp;
      <button class="btn btn-sm btn-outline-dark" ng-click="getRunning()">Refresh</button>
    </div>
  </div>
</div>
<!-- /.content-header -->

<!-- Main content -->
<div class="content positions-font">
  <div class="">

    <table class="table table-hover table-sm table-striped" ng-class="{'table-responsive': isMobileDevice()}">
      <thead>
        <tr>
          <th>Strategy</th>
          <th>Autostart</th>
          <th>Status</th>
          <th class="text-right">Action</th>
        </tr>
      </thead>
      <tbody ng-class="{'mobile_font': isMobileDevice()}">
        <tr ng-repeat="stg in strategies">
          <td>{{stg.name}}</td>
          <td>{{stg.autostart?'Yes':stg.delay_start?stg.delay_start:'No'}}</td>
          <td class="text-bold"
            ng-class="{'text-success': stg.status == 'online', 'text-danger': stg.status!= 'online'}">{{stg.status}}
          </td>
          <td class="no-wrap text-right">
            <button class="btn btn-sm btn-outline-danger" ng-click="clearStg(stg)">Clear</button>
            <button class="btn btn-sm btn-outline-danger" ng-click="stop(stg)"
              ng-if="stg.status=='online'">Stop</button>
            <button class="btn btn-sm btn-outline-success" ng-click="start(stg)"
              ng-if="stg.status=='stopped'">Start</button>
          </td>
        </tr>
      </tbody>
    </table>

  </div><!-- /.container-fluid -->
</div>
<!-- /.content -->
