<style>
  @import url('https://fonts.googleapis.com/css2?family=ABeeZee&display=swap');

  .positions-font {
    font-family: 'ABeeZee', sans-serif;
  }

  .mobile_font {
    font-size: 15px;
  }

  .no-wrap {
    white-space: nowrap;
  }

  .dash-btn {
    height: 20px;
    font-size: 15px;
    line-height: 15px;
    padding: 0 5px;
  }

  .card-counter-desktop {
    font-family: 'ABeeZee', sans-serif;
    box-shadow: 2px 2px 10px #DADADA;
    margin: 5px;
    padding: 20px 10px;
    background-color: #fff;
    height: 60px;
    border-radius: 5px;
    transition: .3s linear all;
  }

  .card-counter-desktop:hover {
    box-shadow: 4px 4px 20px #DADADA;
    transition: .3s linear all;
  }

  .card-counter-desktop.primary {
    background-color: #007bff;
    color: #FFF;
  }

  .card-counter-desktop.danger {
    background-color: #f5c6cb;
    color: #000;
  }

  .card-counter-desktop.success {
    background-color: #c3e6cb;
    color: #000;
  }

  .card-counter-desktop.info {
    background-color: #26c6da;
    color: #000;
  }

  .card-counter-desktop i {
    font-size: 2em;
    opacity: 0.2;
    position: absolute;
    right: 25px;
    top: 20px;
  }

  .card-counter-desktop .count-numbers {
    position: absolute;
    right: 50px;
    top: 24px;
    font-size: 18px;
    opacity: 0.7;
    display: block;
  }

  .card-counter-desktop .count-name {
    position: absolute;
    left: 25px;
    top: 24px;
    /* font-style: italic; */
    text-transform: capitalize;
    opacity: 0.7;
    display: block;
    font-size: 18px;
  }

  .card-counter {
    font-family: 'ABeeZee', sans-serif;
    box-shadow: 2px 2px 10px #DADADA;
    margin: 5px;
    padding: 20px 10px;
    background-color: #fff;
    height: 50px;
    border-radius: 5px;
    transition: .3s linear all;
  }

  .card-counter:hover {
    box-shadow: 4px 4px 20px #DADADA;
    transition: .3s linear all;
  }

  .card-counter.primary {
    background-color: #007bff;
    color: #FFF;
  }

  .card-counter.danger {
    background-color: #f5c6cb;
    color: #000;
  }

  .card-counter.success {
    background-color: #c3e6cb;
    color: #000;
  }

  .card-counter.info {
    background-color: #26c6da;
    color: #FFF;
  }

  .card-counter i {
    font-size: 1.5em;
    opacity: 0.2;
    position: absolute;
    right: 25px;
    top: 20px;
  }

  .card-counter .count-numbers {
    position: absolute;
    right: 45px;
    top: 21px;
    font-size: 16px;
    font-weight: bold;
    opacity: 0.7;
    display: block;
  }

  .card-counter .count-name {
    position: absolute;
    left: 25px;
    top: 21px;
    /* font-style: italic; */
    text-transform: capitalize;
    opacity: 0.7;
    display: block;
    font-size: 16px;
    font-weight: bold;
  }

</style>

<!-- Content Header (Page header) -->
<div class="content-header positions-font" style="padding: 5px .5rem;">
  <div class="container">
    <div class="row">
      <h5 style="margin-left: -0.5rem; margin-bottom: 0;" class="text-dark">Paper Trading</h5>
    </div>
  </div>
</div>
<!-- /.content-header -->

<!-- Main content -->
<div class="content positions-font">
  <span class="text-muted">AI models are only to identify market trends.</span>
  <div class="row" style="margin: 0 -10px;" ng-show="isMobileDevice()">
    <div class="col-md-3" style="cursor: pointer;" ng-repeat="account in accounts | orderBy: 'fullname'"
      ui-sref="app.positions({platform:account.platform, ts: 0, name: account.name, accountId: account.accountId, full_name: account.fullname})">
      <div class="rainbow card-counter" ng-class="{'danger': account.total<0, 'success': account.total>0}">
        <span class="count-numbers">₹{{roundOff(account.total)}}{{account.total>0?'+':''}}</span>
        <span class="count-name">{{account.fullname}}</span>
        <i class="fa fa-chevron-right"></i>
      </div>
    </div>
  </div>
  <div class="row" style="margin: 0 -10px;" ng-hide="isMobileDevice()">
    <div class="col-md-3" style="cursor: pointer;" ng-repeat="account in accounts | orderBy: 'fullname'"
      ui-sref="app.positions({platform:account.platform, ts: 0, name: account.name, accountId: account.accountId, full_name: account.fullname})">
      <div class="card-counter-desktop" ng-class="{'danger': account.total<0, 'success': account.total>0}">
        <span class="count-numbers">₹{{roundOff(account.total)}}{{account.total>0?'+':''}}</span>
        <span class="count-name">{{account.fullname}}</span>
        <i class="fa fa-chevron-right"></i>
      </div>
    </div>
  </div>
</div>
<!-- /.content -->
