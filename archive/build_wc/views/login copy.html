  <div class="container">

      <div class="col-md-4 login-sec">
        <h2 class="text-center text-dark">Login Now</h2>
        <form class="login-form" ng-submit="login()">
          <div class="form-group">
            <label for="exampleInputEmail1" class="text-uppercase">Username</label>
            <input type="text" ng-change="count('username', 10, 'loginPassword')" class="form-control" ng-model="username">

          </div>
          <div class="form-group">
            <label for="exampleInputPassword1" class="text-uppercase">Password</label>
            <input type="password" ng-change="count('username', 10, 'loginButton')" class="form-control" id="loginPassword" ng-model="password">
          </div>


          <div class="form-check">
            <button type="submit" class="btn btn-primary float-right">Submit</button>
          </div>
        </form>
      </div>
