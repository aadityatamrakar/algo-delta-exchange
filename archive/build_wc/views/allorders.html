<style>
  .positions-font {
    font-family: 'ABeeZee', sans-serif;
  }

</style>
<!-- Content Header (Page header) -->
<div class="content-header positions-font">
  <div class="container">
    <div class="row">
      <h5 style="margin-left: -0.5rem; margin-bottom: 0;" class="text-dark text-bold">Orderbook - {{orders.length}}</h5>
      &nbsp;
    </div>
  </div>
</div>
<!-- /.content-header -->

<!-- Main content -->
<div class="content positions-font">
  <div class="">
    <table ng-style="tableStyle" ng-class="{'table-responsive': isMobileDevice()}" class="table table-sm">
      <thead>
        <tr>
          <td class="text-bold">ID</td>
          <td class="text-bold">Time</td>
          <td class="text-bold">Symbol</td>
          <td class="text-bold">Side</td>
          <td class="text-bold">Type</td>
          <td class="text-bold">Strategy</td>
          <td class="text-bold">Qty</td>
          <td class="text-bold">Price</td>
          <td class="text-bold">Status</td>
        </tr>
      </thead>
      <tbody>
        <tr
          ng-class="{'table-danger': order.transaction_type.toUpperCase() == 'SELL', 'table-success': order.transaction_type.toUpperCase() == 'BUY'}"
          ng-repeat="order in orders">
          <td><a style="color:black" href="javascript:;"
              ui-sref="app.positions({platform: order.account.platform, name: order.account.name, ts: 0, accountId: order.account.accountId, full_name: order.account.full_name})">{{order.placed_by}}</a>
          </td>
          <td>{{order.order_timestamp.substr(11, 8)}}</td>
          <td>{{order.tradingsymbol}}</td>
          <td>{{order.transaction_type}}</td>
          <td>{{order.order_type}}</td>
          <td>{{order.tag}}</td>
          <td>{{order.quantity}}</td>
          <td>{{order.average_price.toFixed(2)}}</td>
          <td><span title="{{order.status_message}}">{{order.status}}</span></td>
        </tr>
      </tbody>
    </table>
  </div><!-- /.container-fluid -->
</div>
<!-- /.content -->
